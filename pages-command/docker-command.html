<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Linux 常用命令</title>
    <link rel="stylesheet" href="command.css">
</head>
<body>
<h1 class="page-title">Docker 常用命令</h1>
<div id="command-container"></div>
<div class="back-wrap">
    <button class="back-btn" onclick="goBackHome()">返回</button>
</div>
<script src="command.js"></script>
<script>
    // 数据格式：[名称, 命令]
    const data = [
        ["列出本地所有镜像", "docker images"],
        ["拉取镜像", "docker pull <镜像名>  #docker pull nginx"],
        ["删除本地镜像", "docker rmi <镜像ID/镜像名>"],
        ["构建镜像", "docker build -t <名称>:<标签> ."],
        ["查看正在运行的容器", "docker ps"],
        ["查看所有容器（包括停止的）", "docker ps -a"],
        ["创建并后台运行容器", "docker run -d --name <名称> -p <主机端口>:<容器端口> <镜像名>"],
        ["启动容器", "docker start <容器名/容器ID>"],
        ["停止容器", "docker stop <容器名/容器ID>"],
        ["重启容器", "docker restart <容器名/容器ID>"],
        ["删除已停止的容器", "docker rm <容器名/容器ID>"],
        ["强制删除容器（运行中也可删）", "docker rm -f <容器名/容器ID>"],
        ["进入容器终端", "docker exec -it <容器名/容器ID> <要执行的命令>  #docker exec -it oracle19c /bin/bash"],
        ["查看容器日志", "docker logs <容器名/容器ID>"],
        ["实时查看容器日志", "docker logs -f <容器名/容器ID>"],
        ["查看容器/镜像详细信息", "docker inspect <容器ID/镜像ID>"],
        ["本地文件复制到容器", "docker cp <本地路径> <容器ID>:<容器路径>"],
        ["容器文件复制到本地", "docker cp <容器ID>:<容器路径> <本地路径>"],
        ["清理无用资源（容器/镜像/缓存）", "docker system prune"],
        ["查看 Docker 磁盘占用", "docker system df"],
        ["查看所有网络", "docker network ls"]
    ];
    renderCommands(data);
</script>
</body>
</html>
