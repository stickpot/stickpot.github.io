<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My</title>
    <!-- 引入 Favicon -->
    <link rel="icon" href="../img/favicon.ico" type="image/x-icon"> <!-- 适配路径：index和labs不在同一目录 -->
    <link rel="stylesheet" href="../common/css/nav-style.css">
    <style>
    </style>
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
    <script src="../common/js/security/security-tools.js"></script>
</head>
<body>
<div class="container">
    <!-- 标题+返回按钮容器 -->
    <div class="title-wrapper">
        <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> 返回首页</a>
        <h1 class="page-title">My</h1>
    </div>
    <div id="dynamicNav" style="display: none" ></div>
    <!-- 底部信息 -->
    <div class="footer">
        <p>全能导航页 &copy; 2024 | 高效便捷，一网打尽</p>
    </div>
</div>

<script>
    window.addEventListener('load', () => {
        let salt = localStorage.getItem(getUrlParam("type"));
        let sk = localStorage.getItem("sk" + salt);
        if (sk && salt && sk.includes(salt)) {
            try {
                var buildKey = sk.substring(0, sk.length - salt.length);
                var encryptStr = "U2FsdGVkX1+pTgrk7ylQd4cTtn932/gAUmob//BIeudFttyi3Li8rK8TVAZt0Wbn";
                var key = CryptoJS.SHA256(buildKey).toString();
                var bytes = CryptoJS.AES.decrypt(encryptStr, key);
                var url = bytes.toString(CryptoJS.enc.Utf8);
                var container = document.getElementById('dynamicNav');
                var newDiv = createNavCard('My Test', 'fa-palette', [
                    {text: 'Test My', href: url}
                ]);
                container.parentNode.insertBefore(newDiv, container.nextSibling);
            } catch (e) {
                alert("警告，非法进入！！！")
            }
        } else {
            alert("警告，非法进入！！！")
        }
    });
</script>
</body>
</html>
